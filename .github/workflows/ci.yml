name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install pinned Python environment
        run: uv sync --frozen
      - name: Lint and type-check
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy apps/api-gateway/app scripts
      - name: Test
        run: uv run pytest
      - name: Scan source for unaccepted secret patterns
        run: |
          if git grep -n -E '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|JWT_SECRET=.{32,})'; then
            echo "Potential secret detected" >&2
            exit 1
          fi

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
