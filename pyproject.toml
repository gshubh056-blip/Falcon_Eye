[project]
name = "falcon-eye"
version = "0.1.0"
description = "FALCON smart perimeter and border monitoring platform"
requires-python = "==3.12.9"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "psycopg[binary]==3.2.3",
  "redis==5.2.1",
  "paho-mqtt==2.1.0",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.8.4",
  "mypy==1.14.1",
  "pre-commit==4.0.1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests"]
